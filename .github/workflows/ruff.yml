name: ruff

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: |
            src
            tests
          version: ">=0.15"
          args: "check"
      - name: Ruff format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: |
            src
            tests
          version: ">=0.15"
          args: "format --check"
